services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: civicconnect_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DRUPAL_HASH_SALT: civicconnect_dev_salt_harborview_2026_secure
      PHP_MEMORY_LIMIT: 512M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - civicconnect-net

  nginx:
    image: nginx:1.25-alpine
    container_name: civicconnect_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - civicconnect-net

  db:
    image: mysql:8.0
    container_name: civicconnect_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      civicconnect-net:
        aliases:
          - mysql
          - db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: civicconnect_mailhog
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    networks:
      - civicconnect-net

networks:
  civicconnect-net:
    driver: bridge

volumes:
  db_data:
    driver: local
