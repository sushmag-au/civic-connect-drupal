# Drupal 11 Services Configuration for CivicConnect Headless API
parameters:
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    gc_maxlifetime: 200000
    cookie_lifetime: 2000000
    cookie_samesite: Lax

  twig.config:
    debug: false
    auto_reload: null
    cache: true

  renderer.config:
    required_cache_contexts:
      - 'languages:language_interface'
      - 'theme'
      - 'user.permissions'
    auto_placeholder_conditions:
      max-age: 0
      contexts:
        - 'session'
        - 'user'
      tags: {}

  http.response.debug_cacheability_headers: false

  # Cross-Origin Resource Sharing (CORS) Configuration
  # Configured for decoupled Next.js frontend consumption
  cors.config:
    enabled: true
    allowedHeaders:
      - 'Authorization'
      - 'Content-Type'
      - 'Accept'
      - 'Origin'
      - 'X-Requested-With'
      - 'X-CSRF-Token'
      - 'Cache-Control'
    allowedMethods:
      - 'GET'
      - 'POST'
      - 'PATCH'
      - 'DELETE'
      - 'OPTIONS'
      - 'HEAD'
    allowedOrigins:
      - 'http://localhost:3000'
      - 'http://127.0.0.1:3000'
      - 'http://localhost:8080'
    exposedHeaders:
      - 'Content-Type'
      - 'X-CSRF-Token'
    maxAge: 3600
    supportsCredentials: true

services: {}
