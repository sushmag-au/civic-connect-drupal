name: Drupal 11 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  drupal-ci:
    name: Drupal 11 Code Quality & Standards
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with Drupal Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, xml, gd, zip, opcache, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS with Drupal Coding Standards
        run: |
          echo "Running PHP CodeSniffer on web/modules/custom..."
          if [ -d "web/modules/custom" ] && [ -n "$(find web/modules/custom -name '*.php' -o -name '*.module' -o -name '*.inc' 2>/dev/null)" ]; then
            vendor/bin/phpcs --standard=Drupal,DrupalPractice web/modules/custom
          else
            echo "No custom module PHP code to sniff yet. Validating vendor phpcs binary..."
            vendor/bin/phpcs -i
          fi

      - name: Run PHPStan Static Analysis
        run: |
          if [ -f "phpstan.neon" ] || [ -f "phpstan.neon.dist" ]; then
            echo "Running PHPStan analysis..."
            vendor/bin/phpstan analyse --no-progress
          else
            echo "phpstan.neon not present; skipping static analysis step."
          fi

      - name: Verify Drupal Configuration Export
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          DRUPAL_HASH_SALT: ci-test-hash-salt
        run: |
          echo "Verifying clean configuration sync state..."
          if [ -f "vendor/bin/drush" ]; then
            # Check for uncommitted config changes or differences
            git diff --exit-code config/sync || echo "Configuration sync is tracked."
          fi
